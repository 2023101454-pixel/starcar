name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Crear config.py con la key secreta
        run: |
          cat > config.py << EOF
          GROQ_API_KEY = "${{ secrets.GROQ_API_KEY }}"
          GROQ_MODEL = "openai/gpt-oss-120b"
          GROQ_MODEL_RESPALDO = "openai/gpt-oss-20b"
          IA_POTENCIA_DIRECCION = 255
          IA_POTENCIA_LLANTAS = 255
          EOF

      - name: Instalar herramientas
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install --upgrade pip buildozer "cython<3.0"

      - name: Compilar APK
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: starcar-apk
          path: bin/*.apk
